name: CI

# Adapted from lncd's ci.yml (#38).
#
# TEST JOBS RUN PER APP, FROM INSIDE THE APP DIRECTORY
# `vp test` must be invoked from inside each app so that app's own
# resolve.alias applies. Run from the repo root instead and the `@/...`
# imports fail to resolve, producing false failures.
#
# NO QUARANTINE
# Do not add test excludes here. If a test fails, fix the test or the code:
# an exclude hides a regression from every later PR.
#
# TYPECHECK IS BLOCKING
# `vp check` covers format and lint only -- it is not a type gate.
# `nx run-many -t typecheck` is, and must stay green.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  check:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check

  test-api:
    name: Test apps/api
    runs-on: ubuntu-latest
    # Throwaway Postgres for the database-backed tests (*.db.test.ts). The
    # database name must end in _test: those tests drop and rebuild its schema.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beztack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/beztack_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # postinstall builds env, payments core and the providers (build:packages).
      - run: pnpm install --frozen-lockfile
      - name: vp test run
        working-directory: apps/api
        run: |
          pnpm exec vp test run \
            --reporter=github-actions \
            --reporter=default

  test-ui:
    name: Test apps/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vp test run
        working-directory: apps/ui
        run: |
          pnpm exec vp test run \
            --reporter=github-actions \
            --reporter=default

  # Mobile layout audit (BZ-117): Playwright drives the built UI at 360 and 393 px
  # with the API mocked in the browser (apps/ui/e2e/mock-api.ts), so it needs no
  # database or payment provider. NOT BLOCKING YET: `continue-on-error` keeps a
  # failure from failing the workflow. Remove it once the job has proven stable and
  # add it to the required checks. Screenshots of failing pages are uploaded.
  e2e-mobile:
    name: Mobile layout (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/ui
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Cache miss: download Chromium and the system libraries it needs.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/ui
        run: pnpm exec playwright install --with-deps chromium
      # Cache hit: the browser is restored, but the system libraries live outside the cache.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/ui
        run: pnpm exec playwright install-deps chromium
      - name: Run mobile layout audit
        working-directory: apps/ui
        run: |
          start=$(date +%s)
          status=0
          pnpm exec playwright test || status=$?
          echo "Playwright run: $(( $(date +%s) - start ))s (build, server start and tests)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-failures
          path: |
            apps/ui/test-results
            apps/ui/playwright-report
          retention-days: 7

  test-packages:
    name: Test packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app suites are covered above.
      - run: pnpm exec nx run-many -t test --exclude @beztack/api,@beztack/ui

  build:
    name: Build all projects
    runs-on: ubuntu-latest
    # The API env schema (packages/env/src/api.ts) is validated at build time.
    # These are throwaway values that satisfy the schema -- they are NOT
    # secrets and must never be reused anywhere real. Keep in sync with
    # packages/env/src/api.ts.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-build-only-secret
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:4173
      APP_NAME: beztack-ci
      APP_URL: http://localhost:5173
      RESEND_FROM_NAME: Beztack CI
      RESEND_FROM_EMAIL: ci@example.test
      RESEND_API_KEY: ci-build-only
      PAYMENTS_SUCCESS_URL: http://localhost:3000/success
      PAYMENTS_CANCEL_URL: http://localhost:3000/cancel
      # Polar would demand six product UUIDs; Mercado Pago needs two strings.
      PAYMENT_PROVIDER: mercadopago
      MERCADO_PAGO_ACCESS_TOKEN: ci-build-only
      MERCADO_PAGO_APPLICATION_ID: ci-build-only
      # Project regional defaults have no code default (#52); any valid pair works.
      DEFAULT_CURRENCY: USD
      DEFAULT_LOCALE: en-US
      VITE_DEFAULT_CURRENCY: USD
      VITE_DEFAULT_LOCALE: en-US
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Without built package outputs, tsc reports TS6305 "output file has not
      # been built from source file" -- noise that hides the real type errors.
      - run: pnpm exec nx run-many -t build --exclude @beztack/api,@beztack/ui,docs
      - run: pnpm exec nx run-many -t typecheck
